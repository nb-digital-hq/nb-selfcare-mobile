name: nb_selfcare
description: "NB SelfCare Mobile: autocuidado diario sin nube ni telemetría (comida, cuerpo, ayuno, cuidado y Nibi)."
publish_to: "none"
version: 1.0.0+5

# Toolchain fijado: Flutter 3.47.x (Dart 3.13.x). Ver .fvmrc.
environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

# ---------------------------------------------------------------------------
# Política de dependencias (docs/02_ARCHITECTURE.md):
#   * PROHIBIDO: Firebase, analytics, crash reporters remotos, google_fonts
#     (descarga fuentes en runtime), flutter_blue_plus (licencia no OSI).
#   * Red permitida: Open Food Facts y las actualizaciones desde GitHub que la
#     persona pide en Ajustes › Acerca de (paquete http, ADR-18).
# ---------------------------------------------------------------------------

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado reactivo e inyección de dependencias
  flutter_riverpod: ^3.4.3

  # Persistencia local (SQLite empaquetado vía build hooks del paquete sqlite3, con FTS5)
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.1
  path_provider: ^2.1.6
  path: ^1.9.0

  # UI: Material You + navegación
  dynamic_color: ^1.7.0
  go_router: ^18.1.1
  intl: any # versión fijada por flutter_localizations

  # Copias de seguridad (.sqlite): exportar / importar
  file_picker: ^13.1.0
  share_plus: ^13.3.1

  # Báscula Xiaomi Mi Scale 2 (Bluetooth LE)
  universal_ble: ^3.1.2

  # Open Food Facts y, solo cuando la persona lo pide, actualizaciones desde
  # GitHub (ADR-18)
  http: ^1.6.0
  crypto: ^3.0.6

  # Escáner de códigos con zxing-cpp por FFI, sin servicios de Google
  flutter_zxing: ^3.1.1
  camera: ^0.11.0
  image_picker: ^1.2.4

  # Informe en PDF para el profesional de salud
  pdf: ^3.13.1
  printing: ^5.15.1

  # Dictado de comidas, solo reconocimiento en el dispositivo
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

  # Logo de la app en cada color de tema (generado desde assets/images/logo.svg
  # con tool/gen_app_icons.py).
  assets:
    - assets/app_icons/

